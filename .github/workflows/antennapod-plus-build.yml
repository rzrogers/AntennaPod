name: AntennaPod+ build

on:
  push:
    branches: [ playlists ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build signed APK"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/antennapod-plus.jks"
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assemblePlayRelease \
            -PreleaseStoreFile="$RUNNER_TEMP/antennapod-plus.jks" \
            -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias=antennapodplus \
            -PreleaseKeyPassword="$KEYSTORE_PASSWORD"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/play/release/*.apk | head -n 1)
          NAME="AntennaPod-plus-build-${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          gh release create "build-${{ github.run_number }}" "$NAME" \
            --target "${{ github.sha }}" \
            --title "AntennaPod+ build ${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }} on the playlists branch. Export your database in AntennaPod+ before installing."
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/antennapod-plus.jks"
